<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#7157ce" />
    <title>Alyzyus · Offline</title>
    <style>
      :root {
        font-family: system-ui, 'Noto Sans Thai', sans-serif;
        color-scheme: light dark;
        color: #252429;
        background: #fcfbf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }
      main {
        max-width: 480px;
        width: 100%;
        border: 1px solid #e7e4e1;
        border-radius: 24px;
        padding: clamp(24px, 6vw, 42px);
        background: #fff;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        font-size: clamp(25px, 6vw, 34px);
        line-height: 1.3;
        margin: 24px 0 14px;
      }
      p {
        color: #625e6c;
        line-height: 1.8;
      }
      button {
        font: inherit;
        min-height: 48px;
        padding: 12px 22px;
        background: #7157ce;
        color: #fff;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #b19df8;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 22px;
        color: #625e6c;
        line-height: 1.7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #15151a;
          color: #f0eeeb;
        }
        main {
          background: #1e1e25;
          border-color: #35343e;
        }
        p,
        small {
          color: #bcb6c8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/static/icons/app-icon-192-v1.png" width="56" height="56" alt="Alyzyus" />
      <h1 id="title">เชื่อมต่ออินเทอร์เน็ตอีกครั้ง</h1>
      <p id="description">
        เปิด Alyzyus ได้เมื่อออนไลน์ ราคาสินค้า สต็อก และสถานะคำสั่งซื้อต้องตรวจจากข้อมูลล่าสุด
        จึงไม่แสดงข้อมูลเก่าขณะออฟไลน์
      </p>
      <button id="retry" type="button">ลองเชื่อมต่ออีกครั้ง</button
      ><small id="note">ยังไม่สามารถสั่งซื้อ ชำระเงิน หรือแก้ไขข้อมูลในโหมดออฟไลน์ได้</small>
    </main>
    <script>
      (() => {
        'use strict';
        const copy = {
          th: [
            'เชื่อมต่ออินเทอร์เน็ตอีกครั้ง',
            'เปิด Alyzyus ได้เมื่อออนไลน์ ราคาสินค้า สต็อก และสถานะคำสั่งซื้อต้องตรวจจากข้อมูลล่าสุด จึงไม่แสดงข้อมูลเก่าขณะออฟไลน์',
            'ลองเชื่อมต่ออีกครั้ง',
            'ยังไม่สามารถสั่งซื้อ ชำระเงิน หรือแก้ไขข้อมูลในโหมดออฟไลน์ได้',
          ],
          en: [
            'Let’s reconnect',
            'Alyzyus needs an internet connection for current prices, stock and order status. We do not show old account or order data offline.',
            'Try again',
            'Ordering, payment and account changes are unavailable offline.',
          ],
          zh: [
            '请重新连接网络',
            'Alyzyus 需要联网核对最新价格、库存和订单状态。离线时不会显示旧的账户或订单资料。',
            '重试',
            '离线时无法下单、付款或修改账户资料。',
          ],
        };
        let locale = 'th';
        try {
          locale = localStorage.getItem('alyzyus-locale') || 'th';
        } catch {}
        if (!copy[locale]) locale = 'th';
        document.documentElement.lang = locale;
        ['title', 'description', 'retry', 'note'].forEach(
          (id, i) => (document.getElementById(id).textContent = copy[locale][i])
        );
        document.getElementById('retry').addEventListener('click', () => location.reload());
      })();
    </script>
  </body>
</html>
